name: Vynéo Desktop - Windows et macOS

on:
  pull_request:
    paths:
      - "desktop/**"
      - "assets/icon.png"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

# GH CLI on the prepare runner has no checkout, so repo inference would fail.
# This is a public repository name, not a credential.
env:
  GH_REPO: CocoPerinet/vyneo-mobile-releases

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned dependencies
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check release boundaries and Jellyfin origin
        working-directory: desktop
        run: npm run check
      - name: Test strict signed manifest generation
        working-directory: desktop
        run: npm test

  prepare:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the public Desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --latest=false \
              --title "Vynéo Desktop ${GITHUB_REF_NAME#desktop-v}" \
              --notes "Vynéo Desktop ${GITHUB_REF_NAME#desktop-v} : barre de navigation visible pendant le défilement, menu de profil indiquant le vrai statut de mémorisation, recommandations affinées et restauration sécurisée de la session. Moteur G7y/Qwen3 natifs non encore activés, lecture MPV native non livrée."
          fi
          # Desktop Stable must not be a GitHub prerelease. Keep the Android
          # release selected as the repository's Latest release.
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)" = false

  windows_preview:
    name: Windows x64 / lecture seule / NSIS
    needs: verify
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.verify.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install pinned dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Verify and generate Vynéo icons
        working-directory: desktop
        run: |
          npm run check
          npm run tauri -- icon ../assets/icon.png
      - name: Verify isolated G6u quality-selection safety policy
        working-directory: desktop
        shell: bash
        run: |
          rustc --edition=2021 --test src-tauri/src/quality_policy.rs -o ./vyneo-quality-tests.exe
          ./vyneo-quality-tests.exe
      - name: Verify signed artifact version binding
        working-directory: desktop
        run: cargo test --locked --manifest-path qa/signed-update-verifier/Cargo.toml
      - name: Verify native Tauri media grant and byte-range tests
        working-directory: desktop/src-tauri
        run: |
          cargo test --bin vyneo-desktop update_tests::
          cargo test --bin vyneo-desktop native_stream::tests
          cargo test --bin vyneo-desktop native_hls::tests
          cargo test --bin vyneo-desktop --features native-e2e-qa native_e2e_qa::tests
      - name: Decode real H.264/AAC HLS fixture in headless Chromium
        working-directory: desktop
        run: npm run qa:hls-first-frame
      - name: Build unsigned PR or manual Windows installer
        if: github.ref_type != 'tag'
        working-directory: desktop
        run: npm run tauri -- build --bundles nsis
      - name: Verify opt-in Preview side-by-side installer without signing
        if: github.ref_type != 'tag'
        working-directory: desktop
        run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.preview.conf.json
      - name: Verify stable NSIS upgrades in place without installing on COCO
        if: github.event_name == 'pull_request'
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./qa/nsis-in-place-upgrade.ps1

  windows_release:
    name: Windows x64 / release signée
    needs: [verify, prepare]
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && needs.verify.result == 'success' && needs.prepare.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install pinned dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Verify and generate Vynéo icons
        working-directory: desktop
        run: |
          npm run check
          npm run tauri -- icon ../assets/icon.png
      - name: Verify isolated G6u quality-selection safety policy
        working-directory: desktop
        shell: bash
        run: |
          rustc --edition=2021 --test src-tauri/src/quality_policy.rs -o ./vyneo-quality-tests.exe
          ./vyneo-quality-tests.exe
      - name: Verify native Tauri media grant and byte-range tests
        working-directory: desktop/src-tauri
        run: |
          cargo test --bin vyneo-desktop update_tests::
          cargo test --bin vyneo-desktop native_stream::tests
          cargo test --bin vyneo-desktop native_hls::tests
          cargo test --bin vyneo-desktop --features native-e2e-qa native_e2e_qa::tests
      - name: Build signed Windows updater and NSIS installer
        if: github.ref_type == 'tag'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "GitHub secret TAURI_SIGNING_PRIVATE_KEY is required for signed releases"
          }
          npm run tauri -- build --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Publish installer, minisign signature and Windows updater
        if: github.ref_type == 'tag'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $source = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if ($null -eq $source -or !(Test-Path "$($source.FullName).sig")) {
            throw "Signed Windows installer missing"
          }
          $asset = "Vyneo-Desktop-$version-windows-x64.exe"
          Copy-Item $source.FullName $asset
          Copy-Item "$($source.FullName).sig" "$asset.sig"
          gh release upload "$env:GITHUB_REF_NAME" "$asset" "$asset.sig" --clobber
          $env:VYNEO_RELEASE_PLATFORM = "windows-x86_64"
          $env:VYNEO_RELEASE_ASSET = $asset
          $env:VYNEO_RELEASE_SIG = "$asset.sig"
          node scripts/release-manifest.mjs


  macos_preview:
    name: macOS QA / ${{ matrix.platform }}
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && needs.verify.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin-aarch64
            suffix: macos-arm64
          - runner: macos-15-intel
            platform: darwin-x86_64
            suffix: macos-x64
    permissions:
      contents: read
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install pinned dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Verify and generate Vynéo icons
        working-directory: desktop
        run: |
          npm run check
          npm run tauri -- icon ../assets/icon.png
      - name: Verify isolated G6u quality-selection safety policy
        working-directory: desktop
        shell: bash
        run: |
          rustc --edition=2021 --test src-tauri/src/quality_policy.rs -o ./vyneo-quality-tests.exe
          ./vyneo-quality-tests.exe
      - name: Build unsigned manual macOS DMG
        if: github.ref_type != 'tag'
        working-directory: desktop
        run: npm run tauri -- build --bundles dmg

  macos_release:
    name: macOS Release / ${{ matrix.platform }}
    needs: [verify, prepare]
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && needs.verify.result == 'success' && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin-aarch64
            suffix: macos-arm64
          - runner: macos-15-intel
            platform: darwin-x86_64
            suffix: macos-x64
    permissions:
      contents: write
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install pinned dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Verify and generate Vynéo icons
        working-directory: desktop
        run: |
          npm run check
          npm run tauri -- icon ../assets/icon.png
      - name: Verify isolated G6u quality-selection safety policy
        working-directory: desktop
        shell: bash
        run: |
          rustc --edition=2021 --test src-tauri/src/quality_policy.rs -o ./vyneo-quality-tests.exe
          ./vyneo-quality-tests.exe
      - name: Build signed macOS updater and DMG
        if: github.ref_type == 'tag'
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1;
          }
          npm run tauri -- build --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Publish DMG, update archive and platform manifest
        if: github.ref_type == 'tag'
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          VYNEO_RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          folder="src-tauri/target/release/bundle"
          archive="$(find "$folder" -type f -name '*.app.tar.gz' | head -n1)"
          dmg="$(find "$folder" -type f -name '*.dmg' | head -n1)"
          if [[ -z "$archive" || ! -f "$archive.sig" || -z "$dmg" ]]; then
            echo "::error::Signed .app.tar.gz / .sig or DMG missing"
            exit 1
          fi
          updater_asset="Vyneo-Desktop-$version-${{ matrix.suffix }}.app.tar.gz"
          dmg_asset="Vyneo-Desktop-$version-${{ matrix.suffix }}.dmg"
          cp "$archive" "$updater_asset"
          cp "$archive.sig" "$updater_asset.sig"
          cp "$dmg" "$dmg_asset"
          gh release upload "$GITHUB_REF_NAME" \
            "$updater_asset" "$updater_asset.sig" "$dmg_asset" --clobber
          export VYNEO_RELEASE_ASSET="$updater_asset"
          export VYNEO_RELEASE_SIG="$updater_asset.sig"
          node scripts/release-manifest.mjs
