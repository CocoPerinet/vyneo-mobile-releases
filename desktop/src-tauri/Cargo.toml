[package]
name = "vyneo-desktop"
version = "0.2.0"
description = "Vynéo Desktop"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = { version = "=2.12.4", features = ["unstable", "tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
