[package]
name = "vyneo-desktop"
version = "0.2.2"
description = "Vynéo Desktop"
edition = "2021"
rust-version = "1.99"
publish = false

[build-dependencies]
tauri-build = "=2.7.3"

[dependencies]
tauri = { version = "=2.12.4", features = ["unstable", "tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-dialog = "=2.6.0"
# Native Windows Credential Manager and macOS Keychain, never plain localStorage.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "net", "io-util"] }
# Access Managed OAuth is handled by Rust only, never by the Svelte WebView.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
webbrowser = "1.0"
