<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Vynéo</title>
  <link rel="stylesheet" href="./startup.css">
</head>
<body>
  <div class="app">
    <header class="masthead">
      <strong class="brand" aria-label="Vynéo">Vynéo</strong>
      <span class="edition">DESKTOP</span>
      <a class="discovery-link" href="https://vyneo-preview.visyren.fr/app/secure.html">
        <span class="sparkle" aria-hidden="true">✦</span> Découvrir avec l'IA
      </a>
    </header>
    <nav class="navigation" aria-label="Univers Vynéo">
      <span class="selected">Accueil</span><span>Films</span><span>Séries</span><span>Animés</span><span>Pour vous</span>
    </nav>
    <main>
      <section class="hero" aria-label="Votre bibliothèque Vynéo">
        <div class="hero-glow" aria-hidden="true"></div>
        <div class="hero-copy">
          <div class="eyebrow">VOTRE BIBLIOTHÈQUE</div>
          <h1>Le cinéma, à votre façon.</h1>
          <p>Votre bibliothèque, vos découvertes et vos univers réunis au même endroit.</p>
          <div class="hero-buttons">
            <a class="primary" href="vyneo://retry">Ouvrir la bibliothèque <span aria-hidden="true">→</span></a>
          </div>
        </div>
        <div class="art-grid" aria-hidden="true">
          <div class="art art-1"></div><div class="art art-2"></div>
          <div class="art art-3"></div><div class="art art-4"></div>
        </div>
      </section>
      <section class="shelves" aria-label="Aperçu de l'accueil">
        <div class="shelf">
          <h2>Reprendre la lecture</h2>
          <div class="posters progress-row" aria-hidden="true">
            <div class="landscape landscape-1"></div><div class="landscape landscape-2"></div>
            <div class="landscape landscape-3"></div><div class="landscape landscape-4"></div>
          </div>
        </div>
        <div class="shelf">
          <h2>Pour vous</h2>
          <div class="posters" aria-hidden="true">
            <div class="poster poster-1"></div><div class="poster poster-2"></div>
            <div class="poster poster-3"></div><div class="poster poster-4"></div>
            <div class="poster poster-5"></div><div class="poster poster-6"></div>
          </div>
        </div>
      </section>
    </main>
    <footer><span>Vynéo Desktop</span><span>Votre univers multimédia</span></footer>
  </div>
</body>
</html>
